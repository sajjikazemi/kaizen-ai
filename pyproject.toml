[tool.poetry]
name = "kaizen_ai"
version = "0.1.0"
description = "Autonomous agent that finds failing tests, proposes fixes, and opens gated pull requests for human review."
authors = ["Sajjad Kazemi <sajjadkazemi.e@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "kaizen", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^1.0"
langchain = "^1.0"
langchain-mcp-adapters = "^0.1"
langchain-anthropic = ">=0.3,<1.5"
langchain-openai = "^0.3"
azure-identity = "^1.19"
pydantic = "^2.9"
pyyaml = "^6.0"
click = "^8.1"
rich = "^13.9"
scipy = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.7"
mypy = "^1.13"
types-pyyaml = "^6.0"
pre-commit = "^4.0"
langgraph-cli = { extras = ["inmem"], version = "^0.4" }

[tool.poetry.scripts]
kaizen = "kaizen.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# Scope discovery to this project's own test suite - examples/ holds a
# deliberately-failing test fixture (the quickstart's sample project) that
# shouldn't be swept into `pytest` runs at the repo root.
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle errors. I: import sorting. UP: pyupgrade
# (modern syntax for the declared python version). B: bugbear (common
# correctness footguns). SIM: flake8-simplify. C4: comprehension cleanups.
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
# This is the syntax mypy itself is willing to parse, not a statement about
# our supported runtime (that's `python = "^3.11"` above, enforced by ruff's
# target-version too). Pinned to 3.12 because numpy's bundled stubs (pulled
# in transitively via scipy) use syntax that only parses under 3.12+; we
# don't write PEP 695 syntax ourselves, so this has no practical effect on
# catching 3.11-incompatible code of our own.
python_version = "3.12"
ignore_missing_imports = true
# Most third-party deps here (langgraph, langchain, azure-identity, ...)
# ship incomplete/evolving stubs - full strict mode would mostly flag their
# gaps, not ours. This still catches real type errors in our own code.
check_untyped_defs = true
