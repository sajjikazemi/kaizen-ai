[tool.poetry]
name = "kaizen_ai"
version = "0.1.0"
description = "MCP-native agent framework for closed-loop, self-improving software testing and maintenance."
authors = ["Sajjad Kazemi <sajjadkazemi.e@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "kaizen", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
langgraph = "^1.0"
langchain = "^1.0"
langchain-mcp-adapters = "^0.1"
langchain-anthropic = "^0.3"
langchain-openai = "^0.3"
azure-identity = "^1.19"
pydantic = "^2.9"
pyyaml = "^6.0"
click = "^8.1"
rich = "^13.9"
scipy = "^1.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
ruff = "^0.7"
langgraph-cli = { extras = ["inmem"], version = "^0.4" }

[tool.poetry.scripts]
kaizen = "kaizen.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
