# Example kaizen.yaml for a target .NET project.
#
# Place a copy of this file at the root of each project you want Kaizen to
# run against, then: `kaizen run --config kaizen.yaml`
project_name: sample-dotnet-project
repo_path: /home/sajji/proj/SomeDotnetRepo
eval_suite_path: evals/example-suite.yaml

adapter:
  name: dotnet
  build_command: ["dotnet", "build"]
  test_command: ["dotnet", "test"]

# Only needed for task_prompt-style eval cases that drive the project
# through its own MCP server rather than a shell command.
mcp_server:
  command: dotnet
  args: ["run", "--project", "src/SomeDotnetRepo.McpServer"]
  cwd: /home/sajji/proj/SomeDotnetRepo

gate:
  base_branch: main
  branch_prefix: kaizen/fix
  require_review_for: [tier_2_code, tier_3_locked]
  auto_apply_tiers: []   # empty = every PR needs a human, even tier 1

# Two backends available, picked independently of everything else in this
# file - swap by changing `model.backend` only, no code changes needed.
#
# "copilot_cli"  - shells out to the already-authenticated GitHub Copilot
#                  CLI (`copilot -p ...`). No separate API key needed; uses
#                  whatever the operator is already logged into. Good
#                  default when there's no LLM provider deployment yet.
# "langgraph"    - direct provider API calls via LangChain's
#                  "provider:model" convention. Needs an API key
#                  (ANTHROPIC_API_KEY/OPENAI_API_KEY/etc., see .env.example).
#                  Switch to this once a direct LLM deployment exists.
model:
  backend: copilot_cli

  # Used when backend: copilot_cli (Copilot's own model catalog names, or
  # omit/null to let it auto-pick).
  copilot_runner_model: null
  copilot_fixer_model: null

  # Used when backend: langgraph.
  runner_model: anthropic:claude-haiku-4-5   # cheap/fast - just drives MCP tool calls
  fixer_model: anthropic:claude-sonnet-4-5   # stronger - writes the actual patch

  # Used when backend: langgraph AND you have an Azure OpenAI deployment
  # instead of (or in addition to) a direct provider key. A deployment set
  # here for a role overrides the plain runner_model/fixer_model string
  # above for that role. AAD (az login) auth by default - no API key to
  # manage; set auth_mode: api_key + AZURE_OPENAI_API_KEY only if AAD
  # auth isn't available to you.
  # azure:
  #   endpoint: https://your-resource.openai.azure.com/
  #   api_version: "2024-10-21"
  #   auth_mode: azure_ad   # or "api_key"
  #   runner_deployment: gpt-4o-mini
  #   fixer_deployment: gpt-4o-reasoning

trace_store_path: .kaizen/traces.jsonl
